{% extends "base.html" %}
{% block title %}Đăng nhập - Task Manager{% endblock %}
{% block body %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo">TM</div>
            <h1>Task Manager</h1>
            <p>Đăng nhập vào tài khoản của bạn</p>
        </div>
        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Nhập username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Nhập password" required>
            </div>
            <div id="loginError" class="error-msg"></div>
            <button type="submit" class="btn btn-primary btn-full">Đăng nhập</button>
        </form>
        <div class="auth-footer">
            Chưa có tài khoản? <a href="/register">Đăng ký</a>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
