{% extends "base.html" %}
{% block title %}Đăng nhập - Đoàn TN thôn Lam Khê{% endblock %}
{% block body %}
<div class="bg-circle bg1"></div>
<div class="bg-circle bg2"></div>
<div class="bg-circle bg3"></div>

<div class="auth-wrapper">
    <div class="auth-flip" id="authCard">

        <!-- Login -->
        <div class="form-panel login-panel">
            <div class="logo logo-doan auth-logo"><img src="/static/images/logo-doan.webp" alt="Logo Đoàn"></div>
            <h1>Xin chào</h1>
            <p class="subtitle">Đăng nhập để tiếp tục</p>

            <form id="loginForm">
                <div class="input-group">
                    <div class="electric-glow"></div>
                    <div class="electric-border"></div>
                    <input type="text" id="username" placeholder=" " autocomplete="username" required>
                    <label for="username">Username</label>
                </div>

                <div class="input-group">
                    <div class="electric-glow"></div>
                    <div class="electric-border"></div>
                    <input type="password" id="password" placeholder=" " autocomplete="current-password" required>
                    <label for="password">Password</label>
                    <button type="button" class="password-toggle" onclick="togglePassword(this)">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>

                <div id="loginError" class="error-msg"></div>
                <button type="submit" class="main-btn">Đăng nhập</button>
            </form>

            <div class="switch-area">
                <span>Chưa có tài khoản?</span>
                <button type="button" class="switch-circle" onclick="flipCard()" aria-label="Đăng ký">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </div>

        <!-- Register -->
        <div class="form-panel signup-panel">
            <div class="logo logo-doan auth-logo"><img src="/static/images/logo-doan.webp" alt="Logo Đoàn"></div>
            <h1>Tạo tài khoản</h1>
            <p class="subtitle">Bắt đầu cùng Đoàn TN thôn Lam Khê</p>

            <form id="registerForm">
                <div class="input-group">
                    <div class="electric-glow"></div>
                    <div class="electric-border"></div>
                    <input type="text" id="regUsername" placeholder=" " autocomplete="username" required minlength="3">
                    <label for="regUsername">Username</label>
                </div>

                <div class="input-group">
                    <div class="electric-glow"></div>
                    <div class="electric-border"></div>
                    <input type="password" id="regPassword" placeholder=" " autocomplete="new-password" required minlength="4">
                    <label for="regPassword">Password</label>
                    <button type="button" class="password-toggle" onclick="togglePassword(this)">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>

                <div class="input-group">
                    <div class="electric-glow"></div>
                    <div class="electric-border"></div>
                    <input type="password" id="confirmPassword" placeholder=" " autocomplete="new-password" required>
                    <label for="confirmPassword">Xác nhận Password</label>
                </div>

                <div id="registerError" class="error-msg"></div>
                <button type="submit" class="main-btn">Tạo tài khoản</button>
            </form>

            <div class="switch-area">
                <span>Đã có tài khoản?</span>
                <button type="button" class="switch-circle" onclick="flipCard()" aria-label="Đăng nhập">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
            </div>
        </div>

    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
