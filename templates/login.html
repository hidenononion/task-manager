{% extends "base.html" %}
{% block title %}Đăng nhập - Đoàn TN thôn Lam Khê{% endblock %}
{% block body %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo logo-doan"><img src="/static/images/logo-doan.webp" alt="Logo Đoàn"></div>
            <h1>Đoàn TN thôn Lam Khê</h1>
            <p>Đăng nhập vào tài khoản của bạn</p>
        </div>
        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="login-box" id="userBox">
                    <div class="top-highlight"></div>
                    <div class="login-icon-wrap" id="userIconWrap">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="8" r="4" stroke-width="2"/>
                            <path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <svg class="success-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M5 12.5L9.5 17L19 7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <input type="text" id="username" placeholder="Nhập username" autocomplete="username" required>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="login-box" id="passBox">
                    <div class="top-highlight"></div>
                    <div class="login-icon-wrap" id="passIconWrap">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect x="4" y="10" width="16" height="11" rx="2" stroke-width="2"/>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <svg class="success-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M5 12.5L9.5 17L19 7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <input type="password" id="password" placeholder="Nhập password" autocomplete="current-password" required>
                </div>
            </div>
            <div id="loginError" class="error-msg"></div>
            <button type="submit" class="btn btn-primary btn-full login-btn" id="loginBtn">
                <span id="loginSpinner" class="spinner hidden"></span>
                <span id="loginBtnText">Đăng nhập</span>
            </button>
            <div id="loginScan" class="scan-line hidden"></div>
        </form>
        <div class="auth-footer">
            Chưa có tài khoản? <a href="/register">Đăng ký</a>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
