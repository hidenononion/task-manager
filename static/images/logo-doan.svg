<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="circle">
      <circle cx="100" cy="100" r="95"/>
    </clipPath>
  </defs>
  <circle cx="100" cy="100" r="98" fill="#1a6b37" stroke="#fff" stroke-width="2"/>
  <circle cx="100" cy="100" r="90" fill="#1a6b37"/>
  <!-- Green background with stripes -->
  <g clip-path="url(#circle)">
    <rect x="0" y="0" width="200" height="200" fill="#1a6b37"/>
    <line x1="20" y1="180" x2="180" y2="20" stroke="#145a2d" stroke-width="8" opacity="0.3"/>
    <line x1="30" y1="180" x2="190" y2="20" stroke="#145a2d" stroke-width="8" opacity="0.3"/>
    <line x1="10" y1="180" x2="170" y2="20" stroke="#145a2d" stroke-width="8" opacity="0.3"/>
  </g>
  <!-- Red flag -->
  <polygon points="95,20 105,20 103,95 50,55" fill="#d50000"/>
  <polygon points="50,55 103,95 103,85 55,50" fill="#b71c1c"/>
  <!-- Flag waving -->
  <path d="M50,55 Q30,45 45,30 Q60,20 95,20 L105,20 Q70,30 55,45 Z" fill="#d50000"/>
  <path d="M50,55 Q30,45 45,30 Q60,20 95,20 L105,20 Q70,30 55,45 Z" fill="#ff1744" opacity="0.3"/>
  <!-- Yellow star on flag -->
  <polygon points="72,38 76,50 88,50 78,57 82,69 72,62 62,69 66,57 56,50 68,50" fill="#ffd600" transform="translate(-2,-5) scale(0.8)"/>
  <!-- Hand holding pole -->
  <ellipse cx="95" cy="120" rx="18" ry="12" fill="#ffccbc" transform="rotate(-15,95,120)"/>
  <rect x="91" y="95" width="8" height="35" rx="3" fill="#ffccbc" transform="rotate(-5,95,112)"/>
  <ellipse cx="93" cy="130" rx="14" ry="8" fill="#ffccbc" transform="rotate(-10,93,130)"/>
  <!-- Fingers -->
  <path d="M82,115 Q78,120 80,128 Q83,132 88,128 Q90,122 86,116 Z" fill="#ffccbc"/>
  <path d="M86,112 Q83,118 84,126 Q87,130 91,126 Q92,120 89,113 Z" fill="#ffccbc"/>
  <!-- Text circle -->
  <path id="textCircleTop" d="M100,100 m-72,0 a72,72 0 1,1 144,0" fill="none"/>
  <path id="textCircleBottom" d="M100,100 m72,0 a72,72 0 1,1 -144,0" fill="none"/>
  <text font-size="11" font-weight="bold" fill="#ffd600" font-family="Arial, sans-serif" letter-spacing="1">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">ĐOÀN THANH NIÊN</textPath>
  </text>
  <text font-size="10" font-weight="bold" fill="#ffd600" font-family="Arial, sans-serif" letter-spacing="0.5">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">CỘNG SẢN HỒ CHÍ MINH</textPath>
  </text>
</svg>